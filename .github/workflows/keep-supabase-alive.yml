name: Keep Supabase alive

on:
  schedule:
    - cron: '0 12 */3 * *'  # cada 3 días al mediodía UTC
  workflow_dispatch:          # permite ejecución manual desde GitHub Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/CropProfile?select=id&limit=1")

          echo "HTTP status: $STATUS"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Supabase está activo."
          else
            echo "Respuesta inesperada: $STATUS"
            exit 1
          fi
